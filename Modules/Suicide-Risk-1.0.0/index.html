<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suicide Score</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="suicide-score-root"></main>
    <script src="./app.js"></script>
    <script>
      const root = document.getElementById("suicide-score-root");
      const code = new URLSearchParams(window.location.search).get("code");
      let csrfToken;
      let activationContext;
      async function api(path, options = {}) {
        const method = (options.method || "GET").toUpperCase();
        const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
        if (!["GET", "HEAD", "OPTIONS"].includes(method)) {
          if (!csrfToken) {
            const csrf = await fetch("/api/suicide-risk/v1/csrf", { credentials: "same-origin" });
            const body = await csrf.json();
            if (!csrf.ok || !body.token) throw new Error(body?.error?.message || "CSRF token unavailable.");
            csrfToken = body.token;
          }
          headers["X-CSRF-Token"] = csrfToken;
        }
        const response = await fetch(path, { ...options, credentials: "same-origin", headers });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body?.error?.message || "Request failed");
        return body;
      }
      async function activateMedicalHistory() {
        const csrf = await fetch("/api/internal/medical-history/csrf", { credentials: "same-origin" });
        const csrfBody = await csrf.json().catch(() => ({}));
        if (!csrf.ok || !csrfBody.token) throw new Error(csrfBody?.error?.message || "Medical History CSRF token unavailable.");
        const response = await fetch("/api/internal/medical-history/activate", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json", "X-CSRF-Token": csrfBody.token },
          body: JSON.stringify({
            code: activationContext.code,
            patientId: activationContext.context.patientId,
            encounterId: activationContext.context.encounterId,
            requestedByModule: "suicide-risk",
            returnUrl: activationContext.context.returnUrl,
          }),
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body?.error?.message || "Could not open Medical History.");
        return body;
      }
      if (!code) {
        root.textContent = "A valid patient workflow context is required.";
      } else {
        window.SuicideScore.mount(root, {
          patientCode: code,
          dashboardUrl: "/dashboard/",
          adapter: {
            async getPatient(patientCode) {
              activationContext = await api(`/api/suicide-risk/v1/activation/${encodeURIComponent(patientCode)}`);
              return { patientCode: activationContext.code };
            },
            async putScreen(patientCode, payload) {
              const assessment = await api(`/api/suicide-risk/v1/assessments/${encodeURIComponent(patientCode)}`, {
                method: "PUT",
                body: JSON.stringify(payload),
              });
              try {
                const medicalHistory = await activateMedicalHistory();
                window.location.assign(`/modules/medical-history?code=${encodeURIComponent(medicalHistory.code)}`);
              } catch (error) {
                throw new Error(`The suicide-risk assessment was saved, but Medical History could not be opened. Retry continuing to Medical History. ${error.message}`);
              }
              return assessment;
            },
          },
        });
      }
    </script>
  </body>
</html>
