# Integration fragment only. Root deployment/manifest.json and
# deployment/compose.unified.yaml own unified-image topology.
services:
  treatment-plan:
    image: ${INSIGHT_UNIFIED_IMAGE:?set INSIGHT_UNIFIED_IMAGE to the verified unified image}
    expose: ["8109"]
    environment:
      TP_ENV: production
      TP_DATABASE_PATH: /var/lib/insight/treatment-plan/treatment-plan.sqlite3
      TP_AUTHENTICATION_SESSION_URL_FILE: /run/secrets/authentication-session-url
      TP_TRUSTED_INTERNAL_ORIGINS: ${TP_TRUSTED_INTERNAL_ORIGINS:?set trusted Authentication origin}
    volumes:
      - treatment-plan-data:/var/lib/insight/treatment-plan
    secrets: [authentication-session-url]
    stop_grace_period: 45s
secrets:
  authentication-session-url:
    file: ${TP_AUTHENTICATION_SESSION_URL_SECRET:?mount the Authentication URL secret file}
volumes:
  treatment-plan-data:
