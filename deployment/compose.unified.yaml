services:
  insight-unified:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    # Prefer immutable digest: export INSIGHT_UNIFIED_IMAGE='registry/insight-unified@sha256:…'
    image: ${INSIGHT_UNIFIED_IMAGE:?set INSIGHT_UNIFIED_IMAGE to an immutable digest}
    init: false
    read_only: true
    environment:
      TP_ENV: development
      TP_AUTHENTICATION_SESSION_URL: ${TP_AUTHENTICATION_SESSION_URL:?set Authentication session URL}
      TP_TRUSTED_INTERNAL_ORIGINS: ${TP_TRUSTED_INTERNAL_ORIGINS:?set trusted Authentication origin}
      TP_BN_MANAGER_URL: http://127.0.0.1:8108
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-dev-secret-change-me-in-production-min32bytes-long-padding-aaaa}
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run
      - /var/cache/nginx
      - /var/log/nginx
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    volumes:
      - authentication-data:/var/lib/insight/authentication
      - dashboard-data:/var/lib/insight/dashboard
      - add-new-patient-data:/var/lib/insight/add-new-patient
      - diagnosis-data:/var/lib/insight/diagnosis
      - severity-data:/var/lib/insight/severity
      - medical-history-data:/var/lib/insight/medical-history
      - ddi-checker-data:/var/lib/insight/ddi-checker
      - bn-manager-data:/var/lib/insight/bn-manager
      - treatment-plan-data:/var/lib/insight/treatment-plan
      - ${INSIGHT_SECRETS_DIR:-./secrets-empty}:/run/secrets:ro

volumes:
  authentication-data:
  dashboard-data:
  add-new-patient-data:
  diagnosis-data:
  severity-data:
  medical-history-data:
  ddi-checker-data:
  bn-manager-data:
  treatment-plan-data:
