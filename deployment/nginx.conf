pid /run/nginx.pid;

events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;
    access_log off;
    error_log /dev/stderr warn;

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;

        # Gateway liveness and aggregate readiness are never Authentication aliases.
        location = /readyz { proxy_pass http://127.0.0.1:8110; }
        location = /healthz { proxy_pass http://127.0.0.1:8110; }

        location /api/auth {
            proxy_pass http://127.0.0.1:8101;
        }
        location /internal/dashboard {
            proxy_pass http://127.0.0.1:8102;
        }
        location /api/add-new-patient/v1 {
            proxy_pass http://127.0.0.1:8103;
        }
        location = /api/add-new-patient/v1/health {
            proxy_pass http://127.0.0.1:8103/api/health;
        }
        location /api/diagnosis/v1 {
            proxy_pass http://127.0.0.1:8104/diagnosis;
        }
        location = /api/diagnosis/v1/health {
            proxy_pass http://127.0.0.1:8104/health;
        }
        location = /api/diagnosis/v1/ready {
            proxy_pass http://127.0.0.1:8104/ready;
        }
        location /api/v1 {
            proxy_pass http://127.0.0.1:8105;
        }
        location /api/internal/medical-history {
            proxy_pass http://127.0.0.1:8106;
        }
        location /api/ddi-checker/v1 {
            proxy_pass http://127.0.0.1:8107;
        }
        location /api/bn-manager/v1 {
            proxy_pass http://127.0.0.1:8108;
        }
        location /api/treatment-plan/v1 {
            proxy_pass http://127.0.0.1:8109;
        }

        location /modules/authentication {
            proxy_pass http://127.0.0.1:8101;
        }
        location /modules/user-management {
            proxy_pass http://127.0.0.1:8101;
        }
        location /modules/dashboard {
            proxy_pass http://127.0.0.1:8102;
        }
        location /modules/add-new-patient {
            proxy_pass http://127.0.0.1:8103;
        }
        location /modules/diagnosis {
            proxy_pass http://127.0.0.1:8104;
        }
        location /modules/severity {
            proxy_pass http://127.0.0.1:8105;
        }
        location /modules/medical-history {
            proxy_pass http://127.0.0.1:8106;
        }
        location /modules/ddi-checker {
            proxy_pass http://127.0.0.1:8107;
        }
        location /modules/bn-manager {
            proxy_pass http://127.0.0.1:8108;
        }
        location /modules/treatment-plan {
            proxy_pass http://127.0.0.1:8109;
        }

        # Authentication is the application landing page.
        # More-specific API and module locations above take precedence.
        location / {
            proxy_pass http://127.0.0.1:8101;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Dashboard application shell.
        location = /dashboard {
            return 302 /dashboard/;
        }

        location = /dashboard/ {
            root /opt/modules;
            try_files /dashboard/index.html =404;
            default_type text/html;
        }

        location = /dashboard/admin {
            return 302 /dashboard/;
        }

        location = /dashboard/user {
            return 302 /dashboard/;
        }

        location /dashboard/ {
            alias /opt/modules/dashboard/;
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options "nosniff";
        }
    }
}
