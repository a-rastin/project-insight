# Host nginx: TLS termination + security headers + single hop to unified gateway.
# Internal module ports (8101-8109) are never reached from the host edge.

upstream insight_unified_gateway {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name insight.example.invalid;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name insight.example.invalid;

    ssl_certificate /etc/insight/tls/fullchain.pem;
    ssl_certificate_key /etc/insight/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Forwarded-header policy: edge owns proto/host/for; clients cannot inject trust.
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    set_real_ip_from 127.0.0.1;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:8080;
    }
}
